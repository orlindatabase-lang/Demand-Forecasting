server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react-router-dom client-side routes (/, /inventory, /reports/weekly-sales)
    # must all fall back to index.html - there's no server-side route for them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
